version: 2
objectives:
  overall: 'Usage-billing library: metered events to invoices'
state_repo: true
items:
- id: 1
  name: 'meterbill library and CLI: events to invoices'
  type: feature
  status: done
  outcome: Built meterbill package (money, period, events, plans, rating, invoices, cli), seed data (3
    plans, 4 tenants incl. NWD/DE/EUR) and per-module tests; 132 pass, stdlib only.
  created: '2026-11-11'
  ended: '2026-11-11'
  closed_seq: 1
  notes:
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: Zero third-party dependencies (stdlib only; deployment boxes have no internet).'
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: No float anywhere in money math. Money is integer minor units + ISO code; floats
      raise TypeError. Multiplication rounds half-up; from_major rejects excess precision unless a rounding
      mode is given.'
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: Invoice numbers INV-<TENANT>-<YYYY>-<5 digits> are gapless per tenant per year (auditor
      checks). build_invoice returns a draft with no number and never touches data/sequences.json; only
      finalize_invoice advances it (file lock, atomic write).'
  - at: '2026-11-11 21:12:00'
    text: 'Choices to confirm with user: invoice-number year comes from issue date, not billing period
      (Dec period issued in Jan gets new year); plan unit prices may have more decimals than the currency,
      only line amount rounded; flat components always yield a line, per-unit with zero usage yields none;
      events for unpriced meters raise an error (events outside period ignored first). Added meterbill/period.py
      (YYYY-MM Period, start-inclusive/end-exclusive UTC) beyond the requested modules. 132 tests pass.'
- id: 2
  name: Persist finalized invoices atomically with sequence
  type: feature
  status: idea
  created: '2026-11-11'
  notes:
  - at: '2026-11-11 21:12:00'
    text: 'Why: --finalize prints the numbered invoice but doesn''t save it. If the process dies after
      the number is consumed, there''s a gap, which breaks the auditor''s gapless requirement. Persist
      invoice and sequence together.'
- id: 3
  name: Tax calculation per tenant country
  type: feature
  status: done
  outcome: Added meterbill/tax (store, resolver, TaxError), seeded data/tax_rates.json and tax_overrides.json
    (DE .19, FR .20, GB .20, US 0, JP .10, ACM exempt in DE). Rating splits by (meter, country); build_invoice
    taxes each line with per-line ROUND_HALF_EVEN and sums to tax_total; InvoiceLine stores country, tax_rate,
    tax_amount. CLI shows tax columns. 160 tests pass.
  created: '2026-11-11'
  ended: '2026-11-11'
  closed_seq: 3
  notes:
  - at: '2026-11-11 21:12:00'
    text: Tenants have a country but no tax is computed yet.
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: Tax is computed per invoice line: line amount * rate, rounded to the currency minor
      unit with ROUND_HALF_EVEN; invoice tax_total is the sum of the rounded line taxes. Never compute
      tax on the subtotal and round once: finance reconciles each line against the ledger, and invoice-level
      rounding was a cent off at the Q3 close.'
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: Tax follows where usage happened: event properties[''country''], falling back to
      the tenant''s country. Rating splits lines by (meter, country); each line''s rate comes from TaxResolver.rate_for(tenant,
      country, date) (tenant override first, else latest valid_from <= date). meterbill/tax/store.py read_rates()/read_overrides()
      are the only file access for tax data.'
  - at: '2026-11-11 21:12:00'
    text: 'Choices made unasked, worth confirming: Invoice.total now includes tax (pre-tax is Invoice.subtotal).
      Rate date is the invoice issue date, not period end (one line in builder.py). Tiered pricing restarts
      per (meter, country), so multi-country tenants lose some volume discount versus tiering combined
      quantity. Flat fees are taxed in the tenant''s country.'
- id: 4
  name: Windows support for sequence lock (fcntl)
  type: feature
  status: idea
  created: '2026-11-11'
  notes:
  - at: '2026-11-11 21:12:00'
    text: 'SequenceStore lock uses fcntl: macOS/Linux only.'
- id: 5
  name: Tiered (graduated) pricing model
  type: feature
  status: done
  outcome: Added 'tiered' graduated pricing (Tier type, catalog parsing/validation, per-tier rated lines,
    growth seed plan); tests at every boundary, 152 pass.
  created: '2026-11-11'
  ended: '2026-11-11'
  closed_seq: 2
  notes:
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: Tiered pricing is graduated with inclusive upper bounds: unit 1000 bills at tier
      1''s price, unit 1001 at tier 2''s (matches contract wording ''the first 1,000 units at...''; sales
      was burned by a quote read the other way). Do not change to exclusive bounds.'
  - at: '2026-11-11 21:12:00'
    text: 'Tier up_to must be a positive whole number, ascending; only last tier may (and must) be null.
      Each tier line is rounded half-up on its own. Tier lines are labelled ''api_calls (1-1000)'' / ''(10001+)''
      and the label is stored in RatedLine.meter. Fractional usage still works (1000.5 puts 0.5 in tier
      2). Seed plan ''growth'' added, no tenant uses it. Gap: no CLI test for tier-line table output.'
- id: 6
  name: Cache tax rate file reads per process
  type: feature
  status: done
  outcome: Added lru_cache to read_rates()/read_overrides() in meterbill/tax/store.py so each tax file
    is read once per data dir per process; rate_for was re-reading both JSON files for every invoice line,
    ~70% of Northwind's ~40s run. Updated TaxResolver docstring, added a read-once test. Speed-up not
    timed.
  created: '2026-11-11'
  ended: '2026-11-11'
  closed_seq: 4
  notes:
  - at: '2026-11-11 21:12:00'
    text: 'DECISION: tax_rates.json and tax_overrides.json are read once per data_dir per process (functools.lru_cache
      on store.read_rates/read_overrides). Edits to them need a process restart, or store.read_rates.cache_clear()
      and store.read_overrides.cache_clear(). Cached dicts are shared, so callers must never mutate them.
      Why: Northwind''s monthly run took ~40s, ~70% of it re-reading these files per line in rate_for.
      Speed-up not measured after the change.'
  - at: '2026-11-11 21:12:00'
    text: 'Caveat: cache key is data_dir as passed, so str and Path for the same dir cache separately
      (one extra read, harmless). Test: tests/test_tax.py::test_files_read_once_across_lookups. Suite
      passes (161).'
  - at: '2026-11-11 21:13:00'
    text: 'SUPERSEDED by #7: the lru_cache was removed (stale tax overrides in a long-running worker).
      Ignore the read-once decision above; no cache_clear exists anymore.'
- id: 7
  name: Remove tax file cache
  type: feature
  status: done
  brief: Remove lru_cache from tax store reads; no tax data cached across invoice runs.
  outcome: Removed the process-wide tax file cache (lru_cache on read_rates/read_overrides) and its test;
    every lookup reads the files again. A long-running worker kept using a revoked 0% exemption for six
    hours because the cache never re-read tax_overrides.json.
  folder: EPOCHS/007_2026-11-11__remove-tax-file-cache
  repos: []
  created: '2026-11-11'
  started: '2026-11-11'
  ended: '2026-11-11'
  closed_seq: 5
  notes:
  - at: '2026-11-11 21:13:00'
    text: 'DECISION: No tax data (tax_rates.json, tax_overrides.json) is cached across invoice runs, ever;
      every lookup reads the files from disk. This REVERSES #6''s lru_cache decision. Why: the billing
      worker is long-running and ops hand-edit tax_overrides.json; ACM''s DE exemption was revoked in
      the file but the worker kept invoicing at 0% for six hours. Do not use file mtime for invalidation:
      files are rsynced from the config repo with times preserved, so edited files can carry old mtimes.
      If lookups need to be fast, cache only within a single build_invoice call and discard it at the
      end (not built yet; do it when Northwind''s slow runs come up again).'
  - at: '2026-11-11 21:13:00'
    text: Removed lru_cache from store.read_rates/read_overrides, updated docstrings in store.py and resolver.py,
      deleted tests/test_tax.py::test_files_read_once_across_lookups. Suite passes (160). Per-build_invoice
      cache NOT built; Northwind's ~40s run will slow again.
- id: 8
  name: Per-build_invoice tax lookup cache
  type: feature
  status: idea
  created: '2026-11-11'
  notes:
  - at: '2026-11-11 21:13:00'
    text: 'Why: Removing the process cache (#7) brings back per-line file reads in rate_for, ~70% of Northwind''s
      ~40s monthly run. Rule (#7): cache only within a single build_invoice call and discard it at the
      end; never across runs, never mtime-based (rsync preserves mtimes). Start when Northwind complains.'
