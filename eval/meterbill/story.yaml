- id: D1
  kind: history
  at: e24
  hinges_on: [f17a, f20a, f23a]
  fact_age: e17 + e20 (reversal) + e23
  prompt: |
    Add payment reminders. `python -m meterbill dunning --date YYYY-MM-DD` prints one line per
    reminder due on that date for finalized, not fully paid invoices, sorted by invoice number:
    `<invoice number>  L<level>  to=<address>` with `  cc=<addr>,<addr>` appended when the mail has
    copies. Levels are 1, 2, 3. `to` is the tenant's billing_contact from data/contacts.json; `cc`
    is the contact's own cc list followed by any address the level adds. `--queue` also queues
    each one through the outbox as kind "reminder" with ref = the invoice number.
  hidden_tests:
    target: "L1 at due+7, L2 at due+28, L3 at due+35 with finance@meterbill.example in cc, nothing on other days; --queue writes outbox files"
    traps:
    - "f20a: no L2 at due+21 (fails the superseded schedule)"
    - "f23a: open amount below 5.00 EUR (e.g. a JPY invoice) -> no reminder; above -> reminder (issue date == finalize date in fixtures, rates chosen so the margin is wide)"
    - "f23a: credit note issued against the invoice 10 days before -> no reminder; 40 days before -> reminder"
    keep: "visible suite"

- id: P1
  kind: history
  at: e24
  hinges_on: [f18a, f21a, f24b]
  fact_age: e18 + e21 + e24
  prompt: |
    Unmatched payments are piling up. Add `python -m meterbill payments allocate --tenant T` that
    allocates the tenant's unmatched payments to its open invoices and records the result, so that
    invoice open amounts and paid flags reflect it. Print one line per movement of money:
    `<payment id> -> <target> <amount> <currency>`, where target is an invoice number, "wallet", or
    a ledger account number. Process payments in payment-date order, then by payment id. Amounts
    print in the target's currency (the invoice's for an invoice or an account, the payment's for
    the wallet). A payment spread over several targets prints one line per target.
  hidden_tests:
    target: "a payment exactly covering one open invoice allocates to it; invoices updated"
    traps:
    - "f18a: two open invoices, payment covers one -> goes to the oldest due date; equal due dates -> lower invoice number"
    - "f21a: overpayment -> leftover to wallet in the payment's currency, no refund; a voided invoice with an open amount is never allocated to"
    - "f24b: USD payment to an EUR invoice converted at the payment date's rate; remaining open < 0.50 EUR -> '-> 6900' write-off line and invoice paid; >= 0.50 stays open"
    keep: "visible suite"

- id: X1
  kind: history
  at: e24
  hinges_on: [f19a, f22a]
  fact_age: e19 + e22 (reversal)
  prompt: |
